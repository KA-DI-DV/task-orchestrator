server {
    listen 80;
    root /usr/share/nginx/html;

    # API — до оркестратора. Змінна + resolver: nginx шукає адресу сервісу
    # під час запиту, тож стартує, навіть якщо orchestrator ще піднімається.
    resolver 127.0.0.11 valid=10s;
    set $api http://orchestrator:8080;
    location /api/ {
        proxy_pass $api;
        proxy_read_timeout 60s;
    }

    # Файли збірки мають хеш у назві — кешуємо надовго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: будь-який інший шлях (/tasks/CP-509) віддає index.html, маршрут розбирає React.
    location / {
        try_files $uri /index.html;
    }
}
