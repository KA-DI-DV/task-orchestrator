# Скорочення для частих команд (https://taskfile.dev).
# Встановити: brew install go-task
#
#   task                              — список команд
#   task up                           — зібрати і запустити все в Docker
#   task admin                        — відкрити адмін-панель (задачі запускаються там)
#
# Змінна називається KEY, а не TASK: TASK у Taskfile зарезервована
# (це назва поточної команди).
version: '3'

tasks:
  default:
    desc: Показати список команд
    silent: true
    cmds:
      - task --list

  up:
    desc: Зібрати і запустити все в Docker
    cmds:
      - docker compose up -d --build

  admin:
    desc: Відкрити адмін-панель у браузері (http://localhost:3080)
    cmds:
      - open http://localhost:3080

  admin:dev:
    desc: Адмін-панель у режимі розробки з hot reload (http://localhost:5173, потрібен task up)
    dir: apps/admin
    cmds:
      - npm install
      - npm run dev

  down:
    desc: Зупинити
    cmds:
      - docker compose down

  logs:
    desc: Логи оркестратора
    cmds:
      - docker compose logs -f orchestrator

  watch:
    desc: "Що агенти роблять прямо зараз: task watch KEY=PROJ-123 (Ctrl+C — вийти)"
    requires:
      vars: [KEY]
    cmds:
      - docker compose exec orchestrator tail -n 100 -F /tmp/workspaces/.logs/{{.KEY}}.log

  changes:
    desc: "Які файли змінено в репозиторіях задачі: task changes KEY=PROJ-123"
    requires:
      vars: [KEY]
    cmds:
      - |
        docker compose exec orchestrator sh -c 'for d in /tmp/workspaces/{{.KEY}}/*/; do
          s=$(git -C "$d" status --short); c=$(git -C "$d" log --oneline --grep="^{{.KEY}}:")
          [ -n "$s$c" ] && printf "== %s\n%s\n%s\n" "$(basename "$d")" "$c" "$s"
        done; true'

  images:minio:
    desc: "Передати в Docker оркестратора образи MinIO для кластера QA (docker.io їх анонімно не віддає; потрібні на Mac)"
    cmds:
      - |
        for image in minio/minio:RELEASE.2025-04-22T22-12-26Z minio/mc:RELEASE.2025-04-16T18-13-26Z; do
          docker save "$image" | docker compose exec -T orchestrator docker load
        done

  cluster:
    desc: "Стан kind-кластера QA в контейнері оркестратора"
    cmds:
      - docker compose exec orchestrator sh -c 'kind get clusters; kubectl --context kind-igaming -n igaming get pods'

  test:
    desc: Запустити Go-тести (в Docker, локальний Go не потрібен)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}/apps/orchestrator":/src -w /src golang:1.27-trixie go test ./...
