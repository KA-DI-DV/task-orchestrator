services:
  postgres:
    image: postgres:18-alpine
    container_name: orchestrator_postgres
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_secret_password
      POSTGRES_DB: orchestrator_db
    ports:
      - "5433:5432"
    volumes:
      # Для PostgreSQL 18+ монтуємо /var/lib/postgresql (а не .../data, як у старих версіях).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build: ./apps/orchestrator
    container_name: orchestrator_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://orchestrator:orchestrator_secret_password@postgres:5432/orchestrator_db?sslmode=disable
    volumes:
      # Репозиторії з Mac (шлях задається в .env як REPOS_DIR).
      - ${REPOS_DIR:-~/Projects}:/workspaces
      # Worktree зберігаються у volume — не губляться при перезапуску контейнера.
      - worktrees:/tmp/workspaces
      # Домашня папка користувача в контейнері: тут Claude Code тримає свій
      # стан (~/.claude.json), щоб він не губився при перезапуску.
      - claude_home:/home/node
      # Налаштування Claude Code з Mac (глобальні CLAUDE.md, skills, agents).
      - ~/.claude:/home/node/.claude
      # Конфіг і MCP можна міняти без перезбирання образу.
      - ./apps/orchestrator/config.yaml:/app/config.yaml:ro
      - ./apps/orchestrator/mcp:/app/mcp:ro
    restart: unless-stopped

  # Адмін-панель (React). nginx роздає зібраний застосунок і проксує /api до оркестратора.
  admin:
    build: ./apps/admin
    container_name: orchestrator_admin
    depends_on:
      - orchestrator
    ports:
      - "3080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  worktrees:
  claude_home:
